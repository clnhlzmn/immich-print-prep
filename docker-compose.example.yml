services:
  immich-print-prep:
    image: ghcr.io/clnhlzmn/immich-print-prep:latest
    container_name: immich-print-prep
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
    environment:
      # Overrides config.yaml; handy for keeping the secret out of the file.
      # IPP_SECRET_KEY: "..."
      TZ: "America/Chicago"
